version: '3.9'

services:
  authentication-service:
    build:
      context: services/AuthenticationService
      dockerfile: dockerfile
    ports:
      - "8081:8080"
    container_name: authentication-service
    restart: always

  clinic-service:
    build:
      context: services/ClinicService
      dockerfile: dockerfile
    ports:
      - "8082:8080"
    container_name: clinic-service
    restart: always

  notification-service:
    build:
      context: services/NotificationService
      dockerfile: dockerfile
    ports:
      - "8083:8080"
    container_name: notification-service
    restart: always

  schedule-service:
    build:
      context: services/ScheduleService
      dockerfile: dockerfile
    ports:
      - "8084:8080"
    container_name: schedule-service
    restart: always
