stages:
  - build

variables:
  DOCKER_REGISTRY: "registry.gitlab.com"
  DOCKER_IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

# Build stage
build:
  stage: build
  image: docker:latest
  services:
    - name: docker:dind
      privileged: true
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN" $DOCKER_REGISTRY
  script:
    - docker build -t $DOCKER_IMAGE_TAG ./client
    - docker build -t $DOCKER_IMAGE_TAG ./server
    - docker push $DOCKER_IMAGE_TAG
