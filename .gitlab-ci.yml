stages:
  - build

# Build the Vue frontend
frontend-build:
  stage: build
  image: node
  script:
    - cd client
    - npm install
    - npm run build
  artifacts:
    paths:
      - client

# Build the Express backend
backend-build:
  stage: build
  image: node
  script:
    - cd server
    - npm install
  artifacts:
    paths:
      - server