image: node:20-alpine

# Cache modules in between jobs per-branch
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - client/node_modules/
    - server/node_modules/

stages:
  - build
  - test

# Build the frontend
frontend-build:
  stage: build
  tags:
    - docker
  script:
    - cd client
    - npm install
    - npm run build
  artifacts:
    paths:
      - client/dist

# Build the backend
backend-build:
  stage: build
  tags:
    - docker
  script:
    - cd server
    - npm install
  artifacts:
    paths:
      - server
