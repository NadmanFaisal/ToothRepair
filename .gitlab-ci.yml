stages:
  - build
  - test

# Build the frontend
frontend-build:
  stage: build
  image: node:20-alpine
  tags:
    - docker
  script:
    - cd client
    - npm install
    - npm run build
  artifacts:
    paths:
      - client/dist

# Builds the authentication service
Authentication-service-build:
  stage: build
  image: maven:3.9.4-eclipse-temurin-17
  tags:
    - docker
  script:
    - cd services/AuthenticationService
    - echo "Building Authentication Service..."
    - mvn clean package
  artifacts:
    paths:
      - services/AuthenticationService/target/

