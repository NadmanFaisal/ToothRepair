stages:
  - build

# Build the client
frontend-build:
  stage: build
  image: node:20-alpine
  script:
    - cd client
    - npm install
    - npm run build
  artifacts:
    paths:
      - client

# Build the server
backend-build:
  stage: build
  image: node:20-alpine
  script:
    - cd server
    - npm install
  artifacts:
    paths:
      - server